<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>data_fin_model — рабочий стол финмодели</title>
<style>
:root{
  --bg:#f7f6f3; --surface:#fff; --surface-2:#f2f0ec; --text:#201e1b; --muted:#6d675f;
  --border:#e7e2da; --accent:#c96442; --accent-ink:#fff; --accent-soft:#f4e7e0;
  --fact:#2f855a; --fact-bg:#eaf5ee; --assume:#2b6cb0; --assume-bg:#e9f0fb;
  --shadow:0 1px 2px rgba(30,25,20,.06),0 10px 30px rgba(30,25,20,.06);
  --radius:16px; --radius-sm:10px;
}
html[data-theme="dark"]{
  --bg:#1a1917; --surface:#232220; --surface-2:#2b2a27; --text:#eceae7; --muted:#a29c94;
  --border:#34322d; --accent:#e08a68; --accent-ink:#1a1917; --accent-soft:#3a2b23;
  --fact:#68d391; --fact-bg:#22332a; --assume:#7cb0f0; --assume-bg:#232f40;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  padding-bottom:84px;transition:background .25s,color .25s}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:12px 22px;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:11px;font-weight:650;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#e8a37f);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.brand small{display:block;font-weight:450;color:var(--muted);font-size:11.5px;letter-spacing:0}
.top-actions{display:flex;align-items:center;gap:8px}
.chip-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);transition:.15s}
.chip-btn:hover{border-color:var(--accent);color:var(--accent)}
.chip-btn.ghost{background:transparent}
.icon-btn{width:36px;height:36px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);display:grid;place-items:center;font-size:16px;transition:.15s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.gchip{font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--muted)}
.dot.on{background:var(--fact)}

/* workspace */
.workspace{max-width:1180px;margin:0 auto;padding:26px 22px 8px}

/* composer */
.composer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 14px 12px;transition:border-color .15s,box-shadow .15s}
.composer.drag{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--text);
  font:inherit;font-size:16px;min-height:26px;max-height:180px;padding:6px 8px}
.composer textarea::placeholder{color:var(--muted)}
.composer-row{display:flex;align-items:center;gap:8px;padding-top:6px}
.composer-row .spacer{flex:1}
.send{width:40px;height:40px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);
  font-size:17px;display:grid;place-items:center;transition:.15s}
.send:hover{filter:brightness(1.05)}
.mic.rec{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 6px var(--accent-soft)}}

/* hero */
.hero{text-align:center;padding:40px 0 10px}
.hero h1{font-size:30px;letter-spacing:-.02em;margin:0 0 8px}
.hero p{color:var(--muted);margin:0 auto 26px;max-width:520px}
.hero .composer{max-width:720px;margin:0 auto;text-align:left}
.suggest{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:16px}
.suggest button{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;
  padding:9px 15px;color:var(--text);font-size:13.5px;transition:.15s}
.suggest button:hover{border-color:var(--accent);color:var(--accent)}
.transcript{min-height:18px;color:var(--accent);font-size:13px;padding:2px 8px}

/* model view */
.section-head{display:flex;align-items:center;gap:12px;margin:22px 2px 12px}
.section-head h2{font-size:18px;margin:0;letter-spacing:-.01em}
.section-head .spacer{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-top:6px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 15px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
.kpi .val{font-size:21px;font-weight:680;letter-spacing:-.01em}
.kpi .val.pos{color:var(--fact)} .kpi .val.neg{color:#c0392b}

.grid-card{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.grid-toolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.grid-toolbar input.title{border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  border-radius:9px;padding:8px 11px;font:inherit;min-width:200px}
.grid-wrap{overflow:auto;max-height:64vh}
table.model{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;white-space:nowrap}
table.model th,table.model td{padding:8px 11px;border-bottom:1px solid var(--border);text-align:right}
table.model thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--muted);
  font-weight:600;text-align:right;border-bottom:1px solid var(--border)}
table.model th.rowname,table.model td.rowname{position:sticky;left:0;z-index:1;text-align:left;
  background:var(--surface);min-width:210px;max-width:260px;overflow:hidden;text-overflow:ellipsis;font-weight:520}
table.model thead th.rowname{z-index:3;background:var(--surface-2)}
tr.group td{background:var(--surface-2);color:var(--muted);font-weight:650;text-transform:uppercase;
  letter-spacing:.04em;font-size:11px;text-align:left;position:sticky;left:0}
td.cell{cursor:text;color:var(--text)}
td.cell.fact{background:var(--fact-bg);color:var(--fact);font-weight:600}
td.cell.assume{background:var(--assume-bg);color:var(--assume)}
td.cell.empty{color:var(--muted)}
td.cell:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
td.total{font-weight:680;background:var(--surface-2)}
.legend{display:flex;gap:16px;padding:9px 14px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.sw.fact{background:var(--fact)} .sw.assume{background:var(--assume)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;overflow-x:auto}
.dock .dlabel{font-size:12px;color:var(--muted);white-space:nowrap;margin-right:2px}
.doc{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:7px 11px;white-space:nowrap;box-shadow:var(--shadow)}
.doc .fmt{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:5px}
.doc .fn{font-size:13px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.doc .meta{font-size:11px;color:var(--muted)}

/* toast */
#toasts{position:fixed;top:16px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);
  border-radius:10px;padding:11px 14px;box-shadow:var(--shadow);max-width:340px;font-size:13.5px;animation:slide .2s ease}
.toast.ok{border-left-color:var(--fact)} .toast.err{border-left-color:#c0392b}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">₽</div>
    <div>data_fin_model<small>рабочий стол финмодели</small></div>
  </div>
  <div class="top-actions">
    <span id="gchip" class="gchip hidden"><span class="dot" id="gdot"></span><span id="gtext"></span></span>
    <button id="gbtn" class="chip-btn hidden"></button>
    <a class="chip-btn ghost" href="/legacy" title="Прежний интерфейс">Классический вид</a>
    <button id="themeBtn" class="icon-btn" title="Сменить тему">◐</button>
  </div>
</header>

<main class="workspace">
  <section id="composerWrap"></section>
  <section id="content"></section>
</main>

<div id="dock" class="dock hidden"></div>
<div id="toasts"></div>
<input type="file" id="fileInput" multiple class="hidden"
       accept=".csv,.xlsx,.txt,.pdf,.zip"/>

<script>
const $=s=>document.querySelector(s);
const state={dash:null,imports:[],google:null,title:'Финмодель',rec:null};
const nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const money=n=>(n==null||isNaN(n))?'—':nf.format(Math.round(n))+' ₽';
const MON=['','янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const KIND={income:'Доходы',expense:'Расходы',investing:'Инвестиции',financing:'Финансирование'};
const fmtMonth=m=>{const[y,mo]=m.split('-');return MON[+mo]+' '+y.slice(2);};
const escapeHtml=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseAmount(s){if(s==null)return null;s=String(s).replace(/ /g,'').replace(/\s/g,'').replace('₽','').replace(',','.');if(s===''||s==='—')return 0;const v=parseFloat(s);return isNaN(v)?null:v;}
async function api(path,opts){const r=await fetch('/api'+path,opts);if(!r.ok){let d='';try{d=(await r.json()).detail||''}catch(e){}throw new Error(d||('HTTP '+r.status));}const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():r.text();}
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200);}

/* theme */
function loadTheme(){document.documentElement.dataset.theme=localStorage.getItem('dfm-theme')||'light';}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('dfm-theme',t);}

/* composer (built once) */
function initUI(){
  $('#composerWrap').innerHTML=`
    <div id="heroHead" class="hero" style="padding-bottom:0">
      <h1>С чего начнём финмодель?</h1>
      <p>Загрузите банковскую выписку (CSV, Excel, PDF, 1С или ZIP) или расскажите о бизнесе голосом — модель соберётся и развернётся здесь как таблица.</p>
    </div>
    <div class="composer" id="composer" style="max-width:760px;margin:0 auto">
      <textarea id="ta" rows="1" placeholder="Опишите бизнес или перетащите сюда выписку…"></textarea>
      <div class="composer-row">
        <button class="icon-btn" id="attachBtn" title="Прикрепить документ">📎</button>
        <button class="icon-btn mic" id="micBtn" title="Голосовой ввод">🎙</button>
        <div class="transcript" id="transcript"></div>
        <div class="spacer"></div>
        <button class="send" id="sendBtn" title="Построить модель">→</button>
      </div>
    </div>
    <div class="suggest" id="suggest">
      <button data-a="attach">📎 Загрузить выписку</button>
      <button data-a="voice">🎙 Рассказать голосом</button>
      <button data-a="demo">Построить модель</button>
    </div>`;
  const ta=$('#ta');
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,180)+'px';});
  $('#attachBtn').onclick=()=>$('#fileInput').click();
  $('#sendBtn').onclick=send;
  $('#micBtn').onclick=toggleMic;
  $('#themeBtn').onclick=toggleTheme;
  $('#fileInput').onchange=e=>upload(e.target.files);
  $('#suggest').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;({attach:()=>$('#fileInput').click(),voice:toggleMic,demo:send}[b.dataset.a]||(()=>{}))();});
  const comp=$('#composer');
  ['dragover','dragenter'].forEach(ev=>comp.addEventListener(ev,e=>{e.preventDefault();comp.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>comp.addEventListener(ev,e=>{e.preventDefault();comp.classList.remove('drag');}));
  comp.addEventListener('drop',e=>{if(e.dataTransfer.files.length)upload(e.dataTransfer.files);});
}

function render(){
  const rows=(state.dash&&state.dash.model_grid&&state.dash.model_grid.rows)||[];
  const hasData=rows.length>0;
  $('#heroHead').classList.toggle('hidden',hasData);
  $('#suggest').classList.toggle('hidden',hasData);
  renderGoogle();
  renderDock();
  $('#content').innerHTML=hasData?modelHTML():'';
  if(hasData)wireGrid();
}

function modelHTML(){
  const k=state.dash.kpi,inv=k.invest||{};
  const cards=[
    ['Выручка (модель)',money(k.revenue_total),''],
    ['Расходы',money(k.expenses_total),''],
    ['Чистая прибыль',money(k.net_profit),k.net_profit>=0?'pos':'neg'],
    ['Маржа',(k.margin_pct==null?'—':k.margin_pct+'%'),k.margin_pct>=0?'pos':'neg'],
    ['Остаток на счёте',money(k.cash_balance),''],
    ['NPV проекта',inv.npv!=null?money(inv.npv):'—',inv.npv==null?'':(inv.npv>=0?'pos':'neg')],
  ].map(([l,v,c])=>`<div class="kpi"><div class="lbl">${l}</div><div class="val ${c}">${v}</div></div>`).join('');
  return `
    <div class="section-head"><h2>Финмодель</h2>
      ${state.dash.industry?`<span class="gchip">· ${escapeHtml(state.dash.industry.name)}</span>`:''}
      <div class="spacer"></div></div>
    <div class="kpis">${cards}</div>
    <div class="grid-card">
      <div class="grid-toolbar">
        <input class="title" id="modelTitle" value="${escapeHtml(state.title)}"/>
        <div class="spacer"></div>
        <button class="chip-btn" id="exportBtn">⬇ Скачать .xlsx</button>
        <span id="sheetsBtns"></span>
      </div>
      <div class="grid-wrap">${gridTableHTML()}</div>
      <div class="legend">
        <span><span class="sw fact"></span> факт из выписки (не редактируется)</span>
        <span><span class="sw assume"></span> допущение — кликните и измените</span>
        <span>Пустую ячейку тоже можно заполнить</span>
      </div>
    </div>`;
}

function gridTableHTML(){
  const g=state.dash.model_grid,months=g.months;
  const head=`<thead><tr><th class="rowname">Статья</th>${months.map(m=>`<th>${fmtMonth(m)}</th>`).join('')}<th>Итого</th></tr></thead>`;
  let body='',lastKind=null;
  g.rows.forEach(row=>{
    if(row.kind!==lastKind){lastKind=row.kind;body+=`<tr class="group"><td colspan="${months.length+2}">${KIND[row.kind]||row.kind}</td></tr>`;}
    const cells=row.cells.map((c,i)=>{
      const editable=c.origin!=='fact';
      const cls=c.origin==='fact'?'fact':(c.origin==='assumption'?'assume':'empty');
      return `<td class="cell ${cls}" data-code="${row.code}" data-month="${months[i]}" ${editable?'contenteditable="true"':''}>${c.v?money(c.v):'—'}</td>`;
    }).join('');
    body+=`<tr><td class="rowname" title="${escapeHtml(row.name)}">${escapeHtml(row.name)}</td>${cells}<td class="total">${money(row.value_total)}</td></tr>`;
  });
  return `<table class="model">${head}<tbody>${body}</tbody></table>`;
}

function wireGrid(){
  $('#exportBtn').onclick=()=>{const t=($('#modelTitle').value||'Финмодель').trim();window.location.href='/api/model/export?title='+encodeURIComponent(t);};
  $('#modelTitle').addEventListener('change',e=>state.title=e.target.value.trim()||'Финмодель');
  document.querySelectorAll('td.cell[contenteditable]').forEach(td=>{
    td.addEventListener('focus',()=>{if(td.textContent.trim()==='—')td.textContent='';});
    td.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();td.blur();}});
    td.addEventListener('blur',()=>saveCell(td));
  });
  renderSheetsButtons();
}

async function saveCell(td){
  const amount=parseAmount(td.textContent);
  if(amount===null){toast('Не число — правка отменена','err');return refreshAll();}
  try{
    await api('/assumptions',{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({items:[{category_code:td.dataset.code,month:td.dataset.month,amount}]})});
    toast('Сохранено · '+fmtMonth(td.dataset.month),'ok');
    await refreshAll();
  }catch(err){toast('Ошибка сохранения: '+err.message,'err');refreshAll();}
}

async function upload(files){
  files=[...files];if(!files.length)return;
  toast('Загрузка: '+files.map(f=>f.name).join(', '));
  let imp=0,dup=0,fail=0;
  for(const f of files){
    const fd=new FormData();fd.append('file',f);
    try{const r=await api('/imports/upload',{method:'POST',body:fd});imp+=r.imported;dup+=r.duplicates;}
    catch(err){fail++;toast(f.name+': '+err.message,'err');}
  }
  toast(`Импортировано ${imp}, дублей ${dup}`+(fail?`, ошибок ${fail}`:''),fail?'err':'ok');
  await refreshAll();
  if($('#content').innerHTML)$('#content').scrollIntoView({behavior:'smooth'});
}

async function refreshAll(){
  try{state.dash=await api('/dashboard');}catch(e){state.dash=null;}
  try{state.imports=await api('/imports');}catch(e){state.imports=[];}
  render();
}
async function refreshGoogle(){try{state.google=await api('/google/status');}catch(e){state.google=null;}}

function renderGoogle(){
  const g=state.google,chip=$('#gchip'),btn=$('#gbtn');
  if(!g||!g.configured){chip.classList.add('hidden');btn.classList.add('hidden');return;}
  chip.classList.remove('hidden');
  $('#gdot').className='dot'+(g.connected?' on':'');
  $('#gtext').textContent=g.connected?'Google подключён':'Google не подключён';
  if(!g.connected){btn.classList.remove('hidden');btn.textContent='Подключить Google';btn.onclick=()=>location.href='/api/google/auth';}
  else btn.classList.add('hidden');
}
function renderSheetsButtons(){
  const host=$('#sheetsBtns');if(!host)return;const g=state.google;
  if(!g||!g.configured||!g.connected){host.innerHTML='';return;}
  host.innerHTML=`<button class="chip-btn" id="pushBtn">↗ В Google Sheets</button> <button class="chip-btn ghost" id="pullBtn">Забрать правки</button>`;
  $('#pushBtn').onclick=async()=>{try{toast('Отправляю в Google Sheets…');const t=($('#modelTitle').value||'Финмодель').trim();const r=await api('/sheets/push?title='+encodeURIComponent(t),{method:'POST'});toast('Готово — таблица открыта','ok');window.open(r.url,'_blank');}catch(e){toast('Ошибка: '+e.message,'err');}};
  $('#pullBtn').onclick=async()=>{try{toast('Читаю правки из таблицы…');const r=await api('/sheets/pull',{method:'POST'});const n=Object.keys(r.updated||{}).length;toast(n?('Обновлено входов: '+n):'Изменений нет','ok');await refreshAll();}catch(e){toast('Ошибка: '+e.message,'err');}};
}

function renderDock(){
  const dock=$('#dock'),list=state.imports||[];
  if(!list.length){dock.classList.add('hidden');return;}
  dock.classList.remove('hidden');
  dock.innerHTML=`<span class="dlabel">Документы</span>`+list.slice(0,14).map(d=>
    `<div class="doc"><span class="fmt">${escapeHtml(d.format)}</span><span class="fn" title="${escapeHtml(d.filename)}">${escapeHtml(d.filename)}</span><span class="meta">+${d.imported}</span></div>`
  ).join('');
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function toggleMic(){
  if(!SR){toast('Голосовой ввод недоступен в этом браузере','err');return;}
  if(state.rec){state.rec.stop();return;}
  const rec=new SR();rec.lang='ru-RU';rec.interimResults=true;rec.continuous=false;
  state.rec=rec;$('#micBtn').classList.add('rec');
  const ta=$('#ta'),base=ta.value;
  rec.onresult=e=>{let s='';for(const r of e.results)s+=r[0].transcript;$('#transcript').textContent=s;ta.value=(base?base+' ':'')+s;};
  rec.onerror=()=>{toast('Микрофон недоступен','err');stopMic();};
  rec.onend=stopMic;rec.start();
}
function stopMic(){if(state.rec){try{state.rec.stop()}catch(e){}}state.rec=null;$('#micBtn').classList.remove('rec');$('#transcript').textContent='';}

function send(){
  const rows=(state.dash&&state.dash.model_grid&&state.dash.model_grid.rows)||[];
