<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>data_fin_model — financial workspace</title>
<style>
:root{--bg:#f7f6f3;--surface:#fff;--surface-2:#f2f0ec;--text:#201e1b;--muted:#6d675f;--border:#e7e2da;
 --accent:#c96442;--accent-ink:#fff;--accent-soft:#f4e7e0;--fact:#2f855a;--fact-bg:#eaf5ee;--assume:#2b6cb0;--assume-bg:#e9f0fb;
 --shadow:0 1px 2px rgba(30,25,20,.06),0 10px 30px rgba(30,25,20,.06);--r:14px;--r2:9px}
html[data-theme="dark"]{--bg:#171614;--surface:#211f1d;--surface-2:#2a2825;--text:#eceae7;--muted:#a29c94;--border:#332f2a;
 --accent:#e08a68;--accent-ink:#171614;--accent-soft:#3a2b23;--fact:#68d391;--fact-bg:#22332a;--assume:#7cb0f0;--assume-bg:#232f40;
 --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}.hidden{display:none!important}
.app{display:grid;grid-template-columns:250px 1fr;height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.side-top{display:flex;align-items:center;gap:10px;padding:14px 16px}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#e8a37f);display:grid;place-items:center;color:#fff;font-weight:800}
.brand b{font-weight:650}.brand small{display:block;color:var(--muted);font-size:11px}
.newbtn{margin:4px 12px 8px;height:38px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.search{margin:0 12px 8px;height:34px;border:1px solid var(--border);background:var(--surface-2);border-radius:9px;color:var(--text);padding:0 11px;font:inherit}
.plabel{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 18px 4px}
.projects{flex:1;overflow:auto;padding:0 8px}
.proj{padding:9px 11px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.proj:hover{background:var(--surface-2)}.proj.active{background:var(--accent-soft)}
.proj .pn{font-weight:550;font-size:13.5px}.proj .pm{font-size:11.5px;color:var(--muted);display:flex;gap:7px}
.tag{font-size:10.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--muted)}
.side-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:10px}
.ava{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px}
.gear{margin-left:auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:16px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border)}
.ptitle{font-size:16px;font-weight:650;border:0;background:transparent;color:var(--text);min-width:200px}
.sp{flex:1}
.btn{height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.on{background:var(--fact)}
.tabs{display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:8px 14px;border-radius:9px 9px 0 0;color:var(--muted);border:1px solid transparent;border-bottom:0;white-space:nowrap;background:transparent}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);background:var(--surface);border-color:var(--border)}
.content{flex:1;overflow:auto;padding:20px}.wrap{max-width:1060px;margin:0 auto}
.composer{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;max-width:720px;margin:0 auto}
.composer.drag{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;font-size:16px;min-height:44px}
.crow{display:flex;gap:8px;align-items:center}.icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:16px}
.icon.rec{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.send{width:40px;height:40px;border-radius:11px;border:0;background:var(--accent);color:var(--accent-ink);font-size:17px}
.hero h1{font-size:26px;text-align:center;margin:6px 0 20px;letter-spacing:-.02em}
.transcript{min-height:16px;color:var(--accent);font-size:13px;padding:0 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:13px 15px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:20px;font-weight:680;margin-top:5px}.v.pos{color:var(--fact)}.v.neg{color:#c0392b}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card h3{margin:0;padding:13px 16px;font-size:14px;border-bottom:1px solid var(--border)}.card .bd{padding:14px 16px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:8px 11px;border-bottom:1px solid var(--border);text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--surface-2);color:var(--muted);font-weight:600;position:sticky;top:0;z-index:1}
td.cell{cursor:text}td.cell.f{background:var(--fact-bg);color:var(--fact);font-weight:600}td.cell.a{background:var(--assume-bg);color:var(--assume)}td.cell.e{color:var(--muted)}
td.cell:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
tr.grp td{background:var(--surface-2);color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.04em;text-align:left;font-weight:650}
.gridwrap{overflow:auto;max-height:62vh}
.rowname{position:sticky;left:0;background:var(--surface);z-index:1;font-weight:520;max-width:230px;overflow:hidden;text-overflow:ellipsis}
thead th.rowname{z-index:2;background:var(--surface-2)}
.total{font-weight:680;background:var(--surface-2)}
.legend{display:flex;gap:14px;padding:9px 16px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);flex-wrap:wrap}
.legend b{width:11px;height:11px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:5px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg{display:flex;flex-direction:column;gap:6px}.fg label{font-size:12.5px;color:var(--muted)}
.fg input,.fg select{height:38px;border:1px solid var(--border);background:var(--surface-2);border-radius:9px;color:var(--text);padding:0 11px;font:inherit}
.fsec{grid-column:1/-1;font-weight:650;margin-top:6px;display:flex;align-items:center;gap:8px}.fsec::after{content:"";flex:1;height:1px;background:var(--border)}
.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.doc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:13px;box-shadow:var(--shadow)}
.doc .fmt{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:5px}
.doc .n{font-weight:550;margin:8px 0 3px}.doc .m{font-size:12px;color:var(--muted)}
.src{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.srcbtn{border:1px dashed var(--border);background:transparent;color:var(--muted);border-radius:9px;padding:9px 13px}.srcbtn:hover{border-color:var(--accent);color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.badge{font-size:10.5px;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:2px 7px;margin-left:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:40}.ov.open{display:block}
.panel{position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(100%);transition:.22s;display:flex;flex-direction:column}
.ov.open .panel{transform:none}
.panel-h{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);font-weight:650}
.panel-b{overflow:auto;padding:6px 0}.sitem{padding:13px 18px;border-bottom:1px solid var(--border)}
.sitem .st{font-weight:550;margin-bottom:3px}.sitem .sd{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:8px}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:6px 12px}.seg button.on{background:var(--accent);color:var(--accent-ink)}
.conn{display:flex;align-items:center;gap:10px;margin-top:8px}.conn .st2{font-size:12px;color:var(--muted);margin-left:auto}
#toasts{position:fixed;top:16px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:11px 14px;box-shadow:var(--shadow);max-width:340px;font-size:13.5px}
.toast.ok{border-left-color:var(--fact)}.toast.err{border-left-color:#c0392b}
</style></head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-top"><div class="logo">₽</div><div class="brand"><b>data_fin_model</b><small>financial workspace</small></div></div>
    <button class="newbtn" id="newProject">＋ New project</button>
    <input class="search" placeholder="Search projects…"/>
    <div class="plabel">Projects</div>
    <div class="projects" id="projects"></div>
    <div class="side-foot"><div class="ava">ME</div><div style="font-size:13px">You<div class="note" style="margin:0">Workspace</div></div>
      <button class="gear" id="gear" title="Settings">⚙</button></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <input class="ptitle" id="ptitle" value="Financial model"/>
      <span id="gchip" class="chip hidden"><span class="dot" id="gdot"></span><span id="gtext"></span></span>
      <div class="sp"></div>
      <button class="btn" id="theme">◐ Theme</button>
      <button class="btn" id="exportBtn">⬇ Export .xlsx</button>
      <button class="btn acc" id="gbtn" style="display:none"></button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="content"><div class="wrap" id="view"></div></div>
  </main>
</div>
<div class="ov" id="ov"><div class="panel">
  <div class="panel-h">Settings<div class="sp" style="flex:1"></div><button class="icon" id="closeSet">✕</button></div>
  <div class="panel-b" id="settings"></div>
</div></div>
<div id="toasts"></div>
<input type="file" id="fileInput" multiple class="hidden" accept=".csv,.xlsx,.txt,.pdf,.zip"/>
<script>
const $=s=>document.querySelector(s);
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const money=n=>(n==null||isNaN(n))?'—':'₽ '+nf.format(Math.round(n));
const MON=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const KIND={income:'Income',expense:'Expenses',investing:'Investments',financing:'Financing'};
const fmtMonth=m=>{const[y,mo]=m.split('-');return MON[+mo]+' '+y.slice(2);};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseAmount(s){if(s==null)return null;s=String(s).replace(/[₽\s ]/g,'').replace(',','.');if(s===''||s==='—')return 0;const v=parseFloat(s);return isNaN(v)?null:v;}
async function api(path,opts){const r=await fetch('/api'+path,opts);if(!r.ok){let d='';try{d=(await r.json()).detail||''}catch(e){}throw new Error(d||('HTTP '+r.status));}const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():r.text();}
function toast(m,k){const t=document.createElement('div');t.className='toast '+(k||'');t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200);}
function loadTheme(){document.documentElement.dataset.theme=localStorage.getItem('dfm-theme')||'light';}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('dfm-theme',t);}

const state={dash:null,imports:[],google:null,params:null,tab:'Overview',title:'Financial model',rec:null};
const TABS=['Overview','Model','Parameters','CAPEX','Staff','Documents'];

function renderProjects(){
  const ind=state.dash&&state.dash.industry?state.dash.industry.name:'Not set';
  const ops=state.dash?state.dash.kpi.operations_count:0;
  const status=ops>0?'facts loaded':'draft';
  $('#projects').innerHTML=`<div class="proj active"><div class="pn">${esc($('#ptitle').value)}</div>
    <div class="pm"><span class="tag">${esc(ind)}</span><span>${status}</span></div></div>
    <div class="note" style="padding:8px 11px">Multiple projects are on the roadmap (backend is single-workspace for now).</div>`;
}
function renderTabs(){$('#tabs').innerHTML=TABS.map(t=>`<button class="tab ${t===state.tab?'active':''}" data-t="${t}">${t}</button>`).join('');
  document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{state.tab=el.dataset.t;renderTabs();renderView();});}

function kpisHTML(){const k=state.dash?state.dash.kpi:{},inv=(k&&k.invest)||{};
  const cards=[['Revenue (model)',money(k.revenue_total),''],['Expenses',money(k.expenses_total),''],
    ['Net profit',money(k.net_profit),k.net_profit>=0?'pos':'neg'],['Margin',(k.margin_pct==null?'—':k.margin_pct+'%'),k.margin_pct>=0?'pos':'neg'],
    ['Cash balance',money(k.cash_balance),''],['NPV',inv.npv!=null?money(inv.npv):'—',inv.npv==null?'':(inv.npv>=0?'pos':'neg')]];
  return `<div class="kpis">${cards.map(([l,v,c])=>`<div class="kpi"><div class="l">${l}</div><div class="v ${c}">${v}</div></div>`).join('')}</div>`;}

function overviewHTML(){
  const has=state.dash&&state.dash.model_grid&&state.dash.model_grid.rows.length;
  return `${has?'':'<div class="hero"><h1>What shall we model?</h1></div>'}
   <div class="composer" id="composer"><textarea id="ta" placeholder="Describe the business or drop a bank statement here…"></textarea>
     <div class="crow"><button class="icon" id="attach" title="Attach">📎</button><button class="icon" id="mic" title="Voice">🎙</button>
       <div class="transcript" id="tr"></div><div class="sp" style="flex:1"></div><button class="send" id="send">→</button></div></div>
   ${has?('<div style="height:18px"></div>'+kpisHTML()+summaryCard()):''}`;
}
function summaryCard(){const k=state.dash.kpi;return `<div class="card"><h3>Project summary</h3>
  <div class="bd" style="color:var(--muted)">${k.operations_count} operations processed · ${state.imports.length} document(s) loaded${state.dash.industry?(' · industry: '+esc(state.dash.industry.name)):''}. Edit assumptions in the Model tab.</div></div>`;}

function gridHTML(){const g=state.dash&&state.dash.model_grid;
  if(!g||!g.rows.length)return `<div class="card"><div class="bd" style="color:var(--muted)">No model yet — upload a bank statement in the Overview tab.</div></div>`;
  const months=g.months;let b='',lk=null;
  g.rows.forEach(r=>{if(r.kind!==lk){lk=r.kind;b+=`<tr class="grp"><td colspan="${months.length+2}">${KIND[r.kind]||r.kind}</td></tr>`;}
    const cells=r.cells.map((c,i)=>{const ed=c.origin!=='fact';const cls=c.origin==='fact'?'f':(c.origin==='assumption'?'a':'e');
      return `<td class="cell ${cls}" data-code="${r.code}" data-month="${months[i]}" ${ed?'contenteditable="true"':''}>${c.v?money(c.v):'—'}</td>`;}).join('');
    b+=`<tr><td class="rowname" title="${esc(r.name)}">${esc(r.name)}</td>${cells}<td class="total">${money(r.value_total)}</td></tr>`;});
  return `<div class="card"><div class="gridwrap"><table><thead><tr><th class="rowname">Line item</th>${months.map(m=>`<th>${fmtMonth(m)}</th>`).join('')}<th>Total</th></tr></thead><tbody>${b}</tbody></table></div>
   <div class="legend"><span><b style="background:var(--fact)"></b>fact from statement (locked)</span><span><b style="background:var(--assume)"></b>assumption — click to edit</span><span>empty cells are editable too</span></div></div>`;}

function paramsHTML(){
  const a=(state.params&&state.params.answers)||{};
  const inds=(state.params&&state.params.industries)||[];
  const sel=(id,opts,val)=>`<select id="p_${id}">`+opts.map(o=>`<option value="${o.v}" ${String(val)===String(o.v)?'selected':''}>${o.l}</option>`).join('')+`</select>`;
  const num=(id,val,ph)=>`<input id="p_${id}" value="${val==null?'':esc(val)}" placeholder="${ph||''}"/>`;
  return `<div class="card"><h3>Model parameters</h3><div class="bd"><div class="form">
    <div class="fsec">Project</div>
    <div class="fg"><label>Industry</label>${sel('industry',inds.map(i=>({v:i.code,l:i.name})),a.industry)}</div>
    <div class="fg"><label>Business stage</label>${sel('business_age',[{v:'existing',l:'Operating'},{v:'new',l:'Launching'}],a.business_age)}</div>
    <div class="fg"><label>Planning horizon</label>${sel('planning_horizon',[{v:'12',l:'12 months'},{v:'24',l:'24 months'},{v:'36',l:'36 months'}],a.planning_horizon||'12')}</div>
    <div class="fg"><label>Tax mode</label>${sel('tax_mode',[{v:'usn6',l:'USN 6%'},{v:'usn15',l:'USN 15%'},{v:'osno',l:'OSNO'},{v:'npd',l:'NPD / patent'},{v:'unknown',l:'Not sure'}],a.tax_mode)}</div>
    <div class="fsec">Revenue &amp; costs</div>
    <div class="fg"><label>Monthly revenue</label>${num('monthly_revenue',a.monthly_revenue,'e.g. 800000')}</div>
    <div class="fg"><label>Payroll / month</label>${num('payroll_monthly',a.payroll_monthly)}</div>
    <div class="fg"><label>Rent &amp; utilities / month</label>${num('rent_monthly',a.rent_monthly)}</div>
    <div class="fg"><label>Discount rate, %/yr</label>${num('discount_rate',a.discount_rate,'20')}</div>
    <div class="fsec">Investment &amp; financing</div>
    <div class="fg"><label>Start CAPEX</label>${num('capex_total',a.capex_total)}</div>
    <div class="fg"><label>Funding source</label>${sel('funding_source',[{v:'own',l:'Own funds'},{v:'loan',l:'Loan'},{v:'investor',l:'Investor'},{v:'mixed',l:'Mixed'}],a.funding_source)}</div>
    <div class="fg"><label>Loan amount</label>${num('loan_amount',a.loan_amount)}</div>
    <div class="fg"><label>Loan rate, %/yr</label>${num('loan_rate',a.loan_rate,'17')}</div>
  </div>
  <div style="margin-top:16px"><button class="btn acc" id="rebuild">Rebuild model</button></div>
  <p class="note">Saving recomputes model assumptions from these drivers. Your manual edits in the Model grid are preserved.</p></div></div>`;}

function capexHTML(){const a=(state.params&&state.params.answers)||{};const cx=a.capex_total?money(parseAmount(a.capex_total)):money(0);
  return `<div class="card"><h3>CAPEX &amp; estimate</h3><div class="bd">
   <div class="kpis"><div class="kpi"><div class="l">Total start CAPEX (from Parameters)</div><div class="v">${cx}</div></div></div>
   <p class="note">Set the total in the Parameters tab — it feeds the model as an investment outflow, and the Excel export builds a full CAPEX sheet with depreciation. A detailed line-item estimate table is on the roadmap.</p>
   <button class="btn">＋ Add line item <span class="badge">soon</span></button></div></div>`;}

function staffHTML(){const a=(state.params&&state.params.answers)||{};const pr=a.payroll_monthly?money(parseAmount(a.payroll_monthly)):money(0);const emp=(a.employees==null||a.employees==='')?'—':esc(a.employees);
  return `<div class="card"><h3>Headcount &amp; payroll</h3><div class="bd">
   <div class="kpis"><div class="kpi"><div class="l">Payroll / month (from Parameters)</div><div class="v">${pr}</div></div><div class="kpi"><div class="l">Team size</div><div class="v">${emp}</div></div></div>
   <p class="note">Set payroll in the Parameters tab — it feeds the model as a monthly expense. A per-role headcount table is on the roadmap.</p>
   <button class="btn">＋ Add role <span class="badge">soon</span></button></div></div>`;}

function docsHTML(){const list=state.imports||[];
  return `<div style="display:flex;align-items:center;margin-bottom:14px"><h3 style="margin:0;font-size:16px">Documents</h3><div class="sp" style="flex:1"></div><button class="btn acc" id="up2">＋ Upload</button></div>
   <div class="docgrid">${list.length?list.map(d=>`<div class="doc"><span class="fmt">${esc(d.format)}</span><div class="n">${esc(d.filename)}</div><div class="m">+${d.imported} rows · ${d.duplicates} dup</div></div>`).join(''):'<div class="note">No documents yet — upload a bank statement.</div>'}</div>
   <div class="card" style="margin-top:16px"><h3>Connect a data source</h3><div class="bd"><div class="src">
     <button class="srcbtn" id="up3">📄 Upload files (CSV/XLSX/PDF/ZIP)</button>
     <button class="srcbtn">🧾 1C exchange / archive <span class="badge">soon</span></button>
     <button class="srcbtn">🏭 ERP (1C:ERP, SAP) <span class="badge">soon</span></button>
     <button class="srcbtn">🗄 SQL warehouse <span class="badge">soon</span></button>
   </div><p class="note">Any source normalizes into a single operations schema; the model updates automatically.</p></div></div>`;}

function renderView(){
  const map={Overview:overviewHTML,Model:gridHTML,Parameters:paramsHTML,CAPEX:capexHTML,Staff:staffHTML,Documents:docsHTML};
  $('#view').innerHTML=(map[state.tab]||overviewHTML)();
  if(state.tab==='Overview')wireComposer();
  if(state.tab==='Model')wireGrid();
  if(state.tab==='Parameters'){const b=$('#rebuild');if(b)b.onclick=saveParams;}
  if(state.tab==='Documents'){const u=()=>$('#fileInput').click();['#up2','#up3'].forEach(id=>{const el=$(id);if(el)el.onclick=u;});}
}
async function saveParams(){
  const ids=['industry','business_age','planning_horizon','tax_mode','monthly_revenue','payroll_monthly','rent_monthly','discount_rate','capex_total','funding_source','loan_amount','loan_rate'];
  const answers={};ids.forEach(id=>{const el=$('#p_'+id);if(el&&el.value!=='')answers[id]=el.value;});
  if(!answers.industry){toast('Pick an industry first','err');return;}
  try{toast('Rebuilding model…');const r=await api('/parameters',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})});
    toast('Model rebuilt · '+r.assumptions_created+' assumptions','ok');await refreshAll();state.tab='Model';renderTabs();renderView();}
  catch(e){toast('Error: '+e.message,'err');}
}

function wireComposer(){
  const comp=$('#composer'),ta=$('#ta');if(!comp)return;
  $('#attach').onclick=()=>$('#fileInput').click();
  $('#send').onclick=send;$('#mic').onclick=toggleMic;
  ['dragover','dragenter'].forEach(e=>comp.addEventListener(e,ev=>{ev.preventDefault();comp.classList.add('drag');}));
  ['dragleave','drop'].forEach(e=>comp.addEventListener(e,ev=>{ev.preventDefault();comp.classList.remove('drag');}));
  comp.addEventListener('drop',ev=>{if(ev.dataTransfer.files.length)upload(ev.dataTransfer.files);});
}
function wireGrid(){
  document.querySelectorAll('td.cell[contenteditable]').forEach(td=>{
    td.addEventListener('focus',()=>{if(td.textContent.trim()==='—')td.textContent='';});
    td.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();td.blur();}});
    td.addEventListener('blur',()=>saveCell(td));});
}
async function saveCell(td){const amount=parseAmount(td.textContent);
  if(amount===null){toast('Not a number — edit cancelled','err');return refreshAll();}
  try{await api('/assumptions',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:[{category_code:td.dataset.code,month:td.dataset.month,amount}]})});
    toast('Saved · '+fmtMonth(td.dataset.month),'ok');await refreshAll();}catch(e){toast('Save error: '+e.message,'err');refreshAll();}}

async function upload(files){files=[...files];if(!files.length)return;toast('Uploading: '+files.map(f=>f.name).join(', '));
  let imp=0,dup=0,fail=0;
  for(const f of files){const fd=new FormData();fd.append('file',f);
    try{const r=await api('/imports/upload',{method:'POST',body:fd});imp+=r.imported;dup+=r.duplicates;}catch(e){fail++;toast(f.name+': '+e.message,'err');}}
  toast(`Imported ${imp}, duplicates ${dup}`+(fail?`, errors ${fail}`:''),fail?'err':'ok');await refreshAll();}

function send(){const has=state.dash&&state.dash.model_grid&&state.dash.model_grid.rows.length;
  if(has){state.tab='Model';renderTabs();renderView();toast('Edit assumption cells directly in the table');}
  else{toast('Attach a bank statement to build the model');$('#fileInput').click();}}

async function refreshAll(){try{state.dash=await api('/dashboard');}catch(e){state.dash=null;}try{state.imports=await api('/imports');}catch(e){state.imports=[];}
  try{state.params=await api('/parameters');}catch(e){state.params=null;}
  renderProjects();render();}
async function refreshGoogle(){try{state.google=await api('/google/status');}catch(e){state.google=null;}}
function render(){renderTabs();renderView();renderGoogleChip();}

function renderGoogleChip(){const g=state.google,chip=$('#gchip'),btn=$('#gbtn');
  if(!g||!g.configured){chip.classList.add('hidden');btn.style.display='none';return;}
  chip.classList.remove('hidden');$('#gdot').className='dot'+(g.connected?' on':'');$('#gtext').textContent=g.connected?'Google connected':'Google not connected';
  if(!g.connected){btn.style.display='';btn.textContent='Connect Google';btn.onclick=()=>location.href='/api/google/auth';}else btn.style.display='none';}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function toggleMic(){if(!SR){toast('Voice input not supported in this browser','err');return;}
  if(state.rec){state.rec.stop();return;}const rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=false;
  state.rec=rec;const mic=$('#mic');if(mic)mic.classList.add('rec');const ta=$('#ta'),base=ta?ta.value:'';
  rec.onresult=e=>{let s='';for(const r of e.results)s+=r[0].transcript;const tr=$('#tr');if(tr)tr.textContent=s;if(ta)ta.value=(base?base+' ':'')+s;};
  rec.onerror=()=>{toast('Microphone unavailable','err');stopMic();};rec.onend=stopMic;rec.start();}
function stopMic(){if(state.rec){try{state.rec.stop()}catch(e){}}state.rec=null;const mic=$('#mic');if(mic)mic.classList.remove('rec');const tr=$('#tr');if(tr)tr.textContent='';}

function renderSettings(){const g=state.google;
  $('#settings').innerHTML=`
   <div class="sitem"><div class="st">Company profile</div><div class="sd">Industry: ${state.dash&&state.dash.industry?esc(state.dash.industry.name):'not set'}</div></div>
   <div class="sitem"><div class="st">Appearance</div><div class="sd">Workspace theme</div>
     <div class="seg"><button data-t="light">Light</button><button data-t="dark">Dark</button></div></div>
   <div class="sitem"><div class="st">Google Sheets</div><div class="sd">Two-way model sync</div>
     <div class="conn">${g&&g.configured?(g.connected?'<span class="st2" style="color:var(--fact)">connected</span>':'<button class="btn" id="setGoogle">Connect Google</button>'):'<span class="st2">not configured</span>'}</div></div>
   <div class="sitem"><div class="st">Data sources</div><div class="sd">Connectors for facts and large databases</div>
     <div class="conn"><span>📄 Files</span><span class="st2" style="color:var(--fact)">active</span></div>
     <div class="conn"><span>🏭 ERP API</span><span class="st2">roadmap</span></div>
     <div class="conn"><span>🗄 SQL warehouse</span><span class="st2">roadmap</span></div></div>
   <div class="sitem"><div class="st">Export</div><div class="sd">Excel .xlsx · Google Sheets · PDF report</div></div>`;
  const sg=$('#setGoogle');if(sg)sg.onclick=()=>location.href='/api/google/auth';
  document.querySelectorAll('.seg button').forEach(b=>{b.classList.toggle('on',b.dataset.t===document.documentElement.dataset.theme);
    b.onclick=()=>{document.documentElement.dataset.theme=b.dataset.t;localStorage.setItem('dfm-theme',b.dataset.t);renderSettings();};});
}

$('#theme').onclick=toggleTheme;
$('#gear').onclick=()=>{renderSettings();$('#ov').classList.add('open');};
$('#closeSet').onclick=()=>$('#ov').classList.remove('open');
$('#ov').onclick=e=>{if(e.target.id==='ov')$('#ov').classList.remove('open');};
$('#fileInput').onchange=e=>upload(e.target.files);
$('#exportBtn').onclick=()=>{const t=($('#ptitle').value||'Financial model').trim();window.location.href='/api/model/export?title='+encodeURIComponent(t);};
$('#newProject').onclick=()=>toast('Multiple projects are on the roadmap (single workspace for now)');
$('#ptitle').addEventListener('change',renderProjects);

loadTheme();renderProjects();renderTabs();renderView();refreshGoogle().then(refreshAll);
</script>
</body>
</html>
